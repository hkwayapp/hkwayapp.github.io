  <h1>喂！介紹返 — 支援</h1>
  <p>多謝你玩《喂！介紹返》。如果你遇到問題、想回報題目或圖片錯誤，歡迎電郵 <a href="mailto:hkwayapp@gmail.com">hkwayapp@gmail.com</a>。</p>
  <h2>回報題目</h2>
  <p>請附上遊戲模式、關卡、題目內容，以及解說卡上顯示嘅題目參考編號（如有），方便我哋核對。毋須提供你嘅個人資料。</p>
  <h2>重設遊戲進度</h2>
  <p>喺 App 開啟「設定」，選擇「重設所有遊戲進度」。重設後，原有分數、回顧同解鎖狀態會清除。</p>
  <h2>私隱</h2>
  <p>請參閱<a href="privacy-policy.html">私隱政策</a>。</p>
